<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>花琵琶文庫 - 縦書き・ルビ対応の無料読書アプリ</title>
<meta name="description" content="金屏風に桜と琵琶。縦書き・ルビ・青空文庫ZIP・EPUB・TXTに対応した、広告なし・登録不要・完全無料の読書アプリ。マーカーとメモ、栞、全文検索、音読、読書記録まで端末内だけで。" />
<meta name="theme-color" content="#0b0907" />
<meta name="color-scheme" content="dark" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="花琵琶文庫" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@400;600;700&family=Zen+Old+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@400;500;700&family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="bg-wash" aria-hidden="true"></div>
<div id="petals" class="petals" aria-hidden="true"></div>

<main id="app">

  <!-- ============ 本棚 ============ -->
  <section id="view-library" class="view" data-view="library">
    <header class="hero">
      <button id="installBtn" class="install-pill" hidden><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M7.6 10.3L12 14.7l4.4-4.4M5 19.5h14"/></svg><span>アプリをインストール</span></button>
      <div id="heroArt" class="hero-art" aria-hidden="true"></div>
      <div class="hero-text">
        <h1 class="brand"><span class="brand-main">花琵琶文庫</span><span class="brand-kana">はなびわぶんこ</span></h1>
        <p class="hero-sub">縦書きで、ルビのままに。<br />桜の下で一冊ずつ。</p>
      </div>
    </header>

    <div id="continueCard" class="continue-card" hidden></div>

    <div class="shelf-tools">
      <label class="search-box">
        <svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.6 15.6l4.6 4.6"/></svg>
        <input id="shelfSearch" type="search" placeholder="書名・著者で絞り込み" autocomplete="off" />
      </label>
      <select id="shelfSort" class="select" aria-label="並び替え">
        <option value="recent">最近読んだ順</option>
        <option value="added">追加した順</option>
        <option value="title">書名順</option>
        <option value="author">著者順</option>
        <option value="progress">進み具合順</option>
      </select>
    </div>
    <div class="shelf-filter" role="tablist" aria-label="本棚の絞り込み">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="reading">読書中</button>
      <button class="chip" data-filter="unread">未読</button>
      <button class="chip" data-filter="done">読了</button>
    </div>

    <div id="shelf" class="shelf"></div>
    <div id="shelfEmpty" class="empty" hidden>
      <p class="empty-emblem" aria-hidden="true">❀</p>
      <p>本棚はまだ空です。<br />右下の「＋」から本を追加してください。</p>
    </div>

    <button id="addBookFab" class="fab" aria-label="本を追加"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>本を追加</span></button>
  </section>

  <!-- ============ 記録 ============ -->
  <section id="view-stats" class="view" data-view="stats" hidden>
    <h2 class="view-title">読書記録</h2>
    <div id="statsBody"></div>
  </section>

  <!-- ============ 栞とメモ ============ -->
  <section id="view-notes" class="view" data-view="notes" hidden>
    <h2 class="view-title">マーカーとメモ</h2>
    <div class="notes-tools">
      <select id="notesBook" class="select" aria-label="本で絞り込み"></select>
      <button id="notesExport" class="btn btn-ghost small">書き出す</button>
    </div>
    <div id="notesBody"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="view-settings" class="view" data-view="settings" hidden>
    <h2 class="view-title">設定と使い方</h2>
    <div id="settingsBody"></div>
  </section>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="nav-btn active" data-go="library"><span class="nav-ico"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 4h3.5v16H4.5zM10 4h3.5v16H10z"/><path d="M15.6 5.1l3.3-.9 3.6 15.1-3.3.9z"/><path d="M4.5 8h3.5M10 8h3.5"/></svg></span><span>本棚</span></button>
    <button class="nav-btn" data-go="stats"><span class="nav-ico"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c-1.2-1.6-1.6-3.6-.9-5.6L12 7.3l.9-.9c.7 2 .3 4-.9 5.6z"/><path d="M12 12c1.9-.6 3.9-.3 5.5 1l-1.2.4.2 1.3c-1.9.2-3.7-.8-4.5-2.7z"/><path d="M12 12c1.2 1.6 1.4 3.7.5 5.6l-.6-1.1-1.2.6c-.6-2 0-4 1.3-5.1z"/><path d="M12 12c-1.9.6-3.9.3-5.5-1l1.2-.4-.2-1.3c1.9-.2 3.7.8 4.5 2.7z"/><circle cx="12" cy="12" r="9"/></svg></span><span>記録</span></button>
    <button class="nav-btn" data-go="notes"><span class="nav-ico"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.2-4.4L16.4 4.4a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L8.4 18.8z"/><path d="M14.5 6.3l3.2 3.2M4 20h16"/></svg></span><span>メモ</span></button>
    <button class="nav-btn" data-go="settings"><span class="nav-ico"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></span><span>設定</span></button>
  </nav>
</main>

<!-- ============ リーダー ============ -->
<div id="reader" class="reader" hidden>
  <div id="rdStage" class="rd-stage">
    <div class="rd-runhead"><span id="rdRunTitle"></span></div>
    <div id="rdViewport" class="rd-viewport"><div id="rdFlow" class="rd-flow"></div></div>
    <div class="rd-runfoot">
      <span id="rdFootLeft"></span>
      <span id="rdFootRight"></span>
    </div>
  </div>
  <div id="rdDim" class="rd-dim" aria-hidden="true"></div>
  <div id="rdTurnHint" class="rd-turnhint" aria-hidden="true"></div>

  <div id="rdTop" class="rd-bar rd-top">
    <button id="rdBack" class="icon-btn" aria-label="本棚へ戻る">‹</button>
    <div class="rd-title"><strong id="rdBookTitle"></strong><small id="rdChapTitle"></small></div>
    <button id="rdSearchBtn" class="icon-btn" aria-label="本の中を検索"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.6 15.6l4.6 4.6"/></svg></button>
    <button id="rdMarkBtn" class="icon-btn" aria-label="このページに栞をはさむ"><svg class="ico fillable" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4.2-5.5 4.2z"/></svg></button>
  </div>

  <div id="rdBottom" class="rd-bar rd-bottom">
    <div class="rd-seek">
      <button id="rdPrevChap" class="icon-btn small" aria-label="前の章">⏮</button>
      <input id="rdSlider" type="range" min="0" max="1000" value="0" aria-label="読書位置" />
      <button id="rdNextChap" class="icon-btn small" aria-label="次の章">⏭</button>
    </div>
    <div id="rdSeekInfo" class="rd-seekinfo"></div>
    <div class="rd-tools">
      <button id="rdTocBtn" class="tool-btn"><span aria-hidden="true"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg></span>目次</button>
      <button id="rdAaBtn" class="tool-btn"><span aria-hidden="true">Aa</span>表示</button>
      <button id="rdTtsBtn" class="tool-btn"><span aria-hidden="true"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.4L12 5.8v12.4l-4.6-3.7H4z"/><path d="M15.4 9.2a4 4 0 0 1 0 5.6M17.9 6.6a7.6 7.6 0 0 1 0 10.8"/></svg></span>音読</button>
      <button id="rdAutoBtn" class="tool-btn"><span aria-hidden="true"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.3"/><path d="M12 9.2V13l2.6 2.2M9.6 3h4.8"/></svg></span>自動</button>
    </div>
  </div>

  <!-- 音読バー -->
  <div id="ttsBar" class="tts-bar" hidden>
    <button id="ttsPlay" class="icon-btn" aria-label="一時停止">⏸</button>
    <div class="tts-info"><strong>音読中</strong><small id="ttsInfo"></small></div>
    <button id="ttsSlower" class="icon-btn small" aria-label="遅く">－</button>
    <span id="ttsRate" class="tts-rate">1.0×</span>
    <button id="ttsFaster" class="icon-btn small" aria-label="速く">＋</button>
    <button id="ttsStop" class="icon-btn small" aria-label="音読をやめる">✕</button>
  </div>

  <!-- 自動めくりバー -->
  <div id="autoBar" class="tts-bar" hidden>
    <span class="auto-ico" aria-hidden="true"><svg class="ico " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7.3"/><path d="M12 9.2V13l2.6 2.2M9.6 3h4.8"/></svg></span>
    <div class="tts-info"><strong>自動ページめくり</strong><small id="autoInfo"></small></div>
    <button id="autoSlower" class="icon-btn small" aria-label="間隔を長く">－</button>
    <span id="autoSec" class="tts-rate">20秒</span>
    <button id="autoFaster" class="icon-btn small" aria-label="間隔を短く">＋</button>
    <button id="autoStop" class="icon-btn small" aria-label="自動めくりをやめる">✕</button>
  </div>

  <!-- 選択ポップアップ -->
  <div id="selPop" class="sel-pop" hidden>
    <button class="hl-dot c1" data-color="1" aria-label="桜色のマーカー"></button>
    <button class="hl-dot c2" data-color="2" aria-label="山吹色のマーカー"></button>
    <button class="hl-dot c3" data-color="3" aria-label="若草色のマーカー"></button>
    <button class="hl-dot c4" data-color="4" aria-label="藤色のマーカー"></button>
    <span class="sel-sep"></span>
    <button data-act="note">メモ</button>
    <button data-act="copy">コピー</button>
    <button data-act="dict">辞書</button>
    <button data-act="speak">音読</button>
  </div>
</div>

<!-- ============ シート（下から出るパネル） ============ -->
<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h3 id="sheetTitle"></h3>
    <button id="sheetClose" class="icon-btn small" aria-label="閉じる">✕</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<input id="fileInput" type="file" multiple accept=".txt,.text,.epub,.zip,.html,.htm,.xhtml,.md,.markdown,text/plain,application/epub+zip,application/zip,text/html,text/markdown" hidden />

<div id="dropOverlay" class="drop-overlay" hidden><div>ここに本のファイルを落としてください<br /><small>TXT・青空文庫ZIP・EPUB・HTML・Markdown</small></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
