name: kotonoha check

on:
  pull_request:
    paths: ["kotonoha/**", ".github/workflows/kotonoha-check.yml"]
  push:
    branches: [main]
    paths: ["kotonoha/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotonoha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kotonoha/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - name: ビルド結果がコミットされているか
        run: git diff --exit-code -- js/
