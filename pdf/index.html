<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>栞PDF - 無料のPDFページ編集</title>
<meta name="description" content="PDFの結合・並べ替え・削除・回転・分割・透かし追加が全部無料でできる編集アプリ。アカウント登録不要、PDFはサーバーに送信されず端末内だけで処理されます。" />
<meta name="theme-color" content="#f6efe1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#211d19" media="(prefers-color-scheme: dark)" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="栞PDF" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="washi-bg" aria-hidden="true"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <span class="brand-emblem" aria-hidden="true">🔖</span>
      <h1>栞PDF</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="メニュー" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 7h16v2H4zM4 15h16v2H4z"/></svg>
    </button>
    <nav id="menuPanel" class="menu-panel" hidden>
      <a class="menu-item" href="../">🏠 アプリ一覧へ</a>
      <button data-action="install" id="installMenuItem" class="menu-item" hidden>📲 アプリをインストール</button>
      <button data-action="clear" class="menu-item danger">🗑 すべてクリアして最初から</button>
    </nav>
  </header>
  <div id="menuScrim" class="menu-scrim" hidden></div>

  <div class="wave-divider" aria-hidden="true"></div>

  <main class="main-area">

    <!-- ファイル未読込時 -->
    <section id="dropZone" class="drop-zone card">
      <div class="drop-icon" aria-hidden="true">📄</div>
      <p class="drop-title">PDFをドラッグ&amp;ドロップ</p>
      <p class="drop-sub">またはタップしてファイルを選択（複数選ぶと結合されます）</p>
      <button id="pickFileBtn" type="button" class="btn btn-primary">ファイルを選択</button>
      <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden />
      <p class="drop-note">🔒 PDFは端末内（このブラウザ）だけで処理されます。サーバーには一切送信されません。</p>
    </section>

    <!-- ツールバー -->
    <section id="toolbar" class="toolbar card" hidden>
      <div class="toolbar-row">
        <button id="addMoreBtn" type="button" class="btn btn-secondary small">＋ ファイル追加</button>
        <button id="selectAllBtn" type="button" class="btn btn-ghost small">全選択</button>
        <span id="selectionCount" class="selection-count"></span>
      </div>
      <div class="toolbar-row toolbar-actions">
        <button id="rotateLeftBtn" type="button" class="icon-action" title="選択ページを左に90°回転" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 1 0 8.94 10h-2.02A7 7 0 1 1 13 5v4l5-5-5-5v4z" transform="scale(-1,1) translate(-24,0)"/></svg>
        </button>
        <button id="rotateRightBtn" type="button" class="icon-action" title="選択ページを右に90°回転" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M13 3a9 9 0 1 1 -8.94 10h2.02A7 7 0 1 0 13 5v4l-5-5 5-5v4z"/></svg>
        </button>
        <button id="deleteSelBtn" type="button" class="icon-action danger" title="選択ページを削除" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM4 7h16" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button id="watermarkBtn" type="button" class="icon-action" title="透かし・ページ番号を追加">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M4 20l2.5-6.5L16 4l4 4-9.5 9.5z"/></svg>
        </button>
      </div>
      <div class="toolbar-row toolbar-export">
        <button id="exportSelBtn" type="button" class="btn btn-secondary small" disabled>選択のみ保存</button>
        <button id="splitZipBtn" type="button" class="btn btn-secondary small">1枚ずつZIP</button>
        <button id="exportAllBtn" type="button" class="btn btn-primary small">PDFを保存</button>
      </div>
    </section>

    <section id="pageGridWrap" hidden>
      <p class="hint-text">ドラッグしてページを並べ替え。カードをタップして選択できます。</p>
      <ul id="pageGrid" class="page-grid"></ul>
    </section>

    <div id="loadingOverlay" class="loading-overlay" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">読み込み中…</p>
    </div>
  </main>

  <footer class="app-footer">
    <p>🔒 PDFは一切サーバーに送信されません。すべてこの端末（ブラウザ）内だけで処理されます。</p>
  </footer>
</div>

<!-- 透かし・ページ番号モーダル -->
<div id="stampModal" class="modal-overlay" hidden>
  <div class="modal ink-modal" role="dialog" aria-modal="true" aria-labelledby="stampTitle">
    <div class="modal-header">
      <span class="modal-emblem" aria-hidden="true">🖋</span>
      <h2 id="stampTitle">透かし・ページ番号を追加</h2>
    </div>

    <div class="modal-body">
      <div class="segmented" id="stampModeSeg">
        <button type="button" class="seg-btn active" data-mode="watermark">透かし</button>
        <button type="button" class="seg-btn" data-mode="pageNumber">ページ番号</button>
      </div>

      <label class="field">
        <span class="field-label" id="stampTextLabel">テキスト</span>
        <input id="stampText" type="text" placeholder="例）サンプル" autocomplete="off" />
      </label>
      <p class="field-note" id="stampTextNote"></p>

      <label class="field">
        <span class="field-label">位置</span>
        <select id="stampPosition">
          <option value="center">中央（斜め）</option>
          <option value="top-left">左上</option>
          <option value="top-center">上中央</option>
          <option value="top-right">右上</option>
          <option value="bottom-left">左下</option>
          <option value="bottom-center">下中央</option>
          <option value="bottom-right">右下</option>
        </select>
      </label>

      <div class="field-row">
        <label class="field half">
          <span class="field-label">文字サイズ <span id="stampSizeVal">48</span></span>
          <input id="stampSize" type="range" min="10" max="120" value="48" />
        </label>
        <label class="field half">
          <span class="field-label">濃さ <span id="stampOpacityVal">35</span>%</span>
          <input id="stampOpacity" type="range" min="10" max="100" value="35" />
        </label>
      </div>

      <label class="field">
        <span class="field-label">色</span>
        <input id="stampColor" type="color" value="#3a2e28" />
      </label>

      <label class="field checkbox-field">
        <input type="checkbox" id="stampSelectedOnly" />
        <span>選択したページのみに追加する</span>
      </label>
    </div>

    <div class="modal-actions">
      <button id="stampApplyBtn" type="button" class="btn btn-primary full">追加する</button>
      <button id="stampCancelBtn" type="button" class="btn btn-secondary full">キャンセル</button>
    </div>
  </div>
</div>

<!-- インストール促し バナー -->
<div id="installBanner" class="install-banner" hidden>
  <span class="install-emblem" aria-hidden="true">🔖</span>
  <div class="install-text">
    <strong>ホーム画面に追加できます</strong>
    <span>アプリのようにワンタッチで開けます</span>
  </div>
  <button id="installBtn" type="button" class="btn btn-primary small">インストール</button>
  <button id="installDismiss" type="button" class="icon-btn small" aria-label="閉じる">✕</button>
</div>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
