<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>和風アプリ集 - 京の家計帖 / つみたての桜</title>
<meta name="description" content="和風・水彩画風デザインのアプリ集。京の家計帖（家計簿）とつみたての桜（新NISAシミュレーター）を選んで開けます。" />
<meta name="theme-color" content="#f6efe1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#211d19" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="nisa/icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="nisa/icons/favicon-16.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper: 246 239 225;
    --ink: 58 46 40;
    --ink-soft: 96 82 72;
    --vermillion: 176 58 46;
    --matcha: 94 140 122;
    --gold: 196 149 63;
    --card-bg: 255 253 248;
    --shadow: 58 46 40;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: 33 29 25;
      --ink: 236 227 214;
      --ink-soft: 196 184 168;
      --card-bg: 45 39 34;
      --shadow: 0 0 0;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color: rgb(var(--ink));
    background: rgb(var(--paper));
    background-image:
      radial-gradient(circle at 15% 15%, rgba(94,140,122,0.16), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(196,149,63,0.16), transparent 40%),
      radial-gradient(circle at 70% 85%, rgba(176,58,46,0.10), transparent 45%);
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 18px 40px;
  }
  header { text-align: center; margin-bottom: 26px; }
  h1 {
    font-family: "Shippori Mincho", serif;
    font-size: 1.5rem;
    margin: 0 0 6px;
    letter-spacing: 0.04em;
  }
  header p {
    margin: 0;
    font-size: 0.86rem;
    color: rgb(var(--ink-soft));
  }
  .apps {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.app-card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    background: rgba(var(--card-bg), 0.92);
    border: 1px solid rgba(var(--gold), 0.3);
    border-radius: 22px;
    padding: 18px;
    box-shadow: 0 8px 24px -10px rgba(var(--shadow), 0.25);
    transition: transform .2s cubic-bezier(.22,.9,.32,1), box-shadow .2s;
  }
  a.app-card:active { transform: scale(0.98); }
  .app-emblem {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 1.7rem;
  }
  .app-emblem.kakeibo { background: linear-gradient(135deg, rgba(176,58,46,0.18), rgba(196,149,63,0.14)); }
  .app-emblem.nisa { background: linear-gradient(135deg, rgba(94,140,122,0.2), rgba(196,149,63,0.16)); }
  .app-info { flex: 1; min-width: 0; }
  .app-info h2 {
    font-family: "Shippori Mincho", serif;
    font-size: 1.08rem;
    margin: 0 0 4px;
  }
  .app-info p {
    margin: 0;
    font-size: 0.8rem;
    line-height: 1.6;
    color: rgb(var(--ink-soft));
  }
  .app-arrow { flex: 0 0 auto; color: rgb(var(--ink-soft)); font-size: 1.2rem; }
  footer {
    text-align: center;
    margin-top: 34px;
    font-size: 0.72rem;
    color: rgb(var(--ink-soft));
    opacity: 0.75;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>和風アプリ集</h1>
    <p>使いたいアプリを選んでください</p>
  </header>

  <div class="apps">
    <a class="app-card" href="./kakeibo/">
      <span class="app-emblem kakeibo" aria-hidden="true">💰</span>
      <span class="app-info">
        <h2>京の家計帖</h2>
        <p>水彩画風・京都風デザインの、ワンタッチで使える無料の家計簿アプリ。</p>
      </span>
      <span class="app-arrow" aria-hidden="true">→</span>
    </a>

    <a class="app-card" href="./nisa/">
      <span class="app-emblem nisa" aria-hidden="true">🌸</span>
      <span class="app-info">
        <h2>つみたての桜</h2>
        <p>桜の木が育つように資産の成長を体感できる、初心者向け新NISAシミュレーター。</p>
      </span>
      <span class="app-arrow" aria-hidden="true">→</span>
    </a>
  </div>

  <footer>各アプリは端末内でのみデータを扱い、サーバーには送信されません。</footer>
</div>
</body>
</html>
