<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>こよみ手帖 - 無料のスケジュール管理アプリ</title>
<meta name="description" content="月間カレンダーに予定とタスクをまとめて書き込める、ジョルテのような完全無料のスケジュール帳アプリ。インストールしてオフラインでも使えます。" />
<meta name="theme-color" content="#f7f3e9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1a1d24" media="(prefers-color-scheme: dark)" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="こよみ手帖" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="paper-bg" aria-hidden="true">
  <div class="ink-blob blob-a"></div>
  <div class="ink-blob blob-b"></div>
  <div class="ink-blob blob-c"></div>
  <div class="paper-texture"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">

  <header class="app-header">
    <div class="brand">
      <span class="brand-emblem" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="32" height="32">
          <rect x="10" y="14" width="44" height="42" rx="6" fill="rgb(250,247,240)" stroke="rgb(58,74,110)" stroke-width="2.4"/>
          <rect x="10" y="14" width="44" height="12" rx="6" fill="rgb(58,74,110)"/>
          <rect x="18" y="6" width="4" height="14" rx="2" fill="rgb(200,158,74)"/>
          <rect x="42" y="6" width="4" height="14" rx="2" fill="rgb(200,158,74)"/>
          <g fill="rgb(58,74,110)" opacity="0.85">
            <rect x="17" y="33" width="7" height="7" rx="1.5"/>
            <rect x="28.5" y="33" width="7" height="7" rx="1.5"/>
            <rect x="40" y="33" width="7" height="7" rx="1.5"/>
            <rect x="17" y="44" width="7" height="7" rx="1.5"/>
          </g>
          <rect x="28.5" y="44" width="7" height="7" rx="1.5" fill="rgb(199,74,58)"/>
          <rect x="40" y="44" width="7" height="7" rx="1.5" fill="rgb(58,74,110)" opacity="0.85"/>
        </svg>
      </span>
      <h1>こよみ手帖</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="メニュー" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94a7.14 7.14 0 0 0 .06-.94 7.14 7.14 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.14.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.6.22l2.39-.96c.49.38 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.14-.56 1.63-.94l2.39.96c.24.1.46 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
    </button>

    <nav id="menuPanel" class="menu-panel" hidden>
      <button data-action="export" class="menu-item">💾 データを書き出す</button>
      <button data-action="import" class="menu-item">📂 データを読み込む</button>
      <button data-action="reset" class="menu-item danger">🗑 全データを削除</button>
      <button data-action="install" id="installMenuItem" class="menu-item" hidden>📲 アプリをインストール</button>
    </nav>
  </header>

  <div id="menuScrim" class="menu-scrim" hidden></div>
  <input type="file" id="importFile" accept="application/json" hidden />

  <!-- 月ナビ -->
  <section class="month-nav card">
    <button id="prevMonth" class="nav-btn" aria-label="前の月">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15 18l-6-6 6-6v12z"/></svg>
    </button>
    <button id="monthDisplay" class="month-display">
      <span id="monthText">2026年8月</span>
    </button>
    <button id="nextMonth" class="nav-btn" aria-label="次の月">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 6l6 6-6 6V6z"/></svg>
    </button>
    <button id="todayBtn" class="btn btn-secondary small">今日</button>
  </section>
  <input type="month" id="monthPicker" class="sr-picker" aria-label="月を選択" />

  <!-- カレンダー -->
  <section class="calendar-card card">
    <div class="weekday-row">
      <span class="wd sun">日</span><span class="wd">月</span><span class="wd">火</span><span class="wd">水</span><span class="wd">木</span><span class="wd">金</span><span class="wd sat">土</span>
    </div>
    <div id="calendarGrid" class="calendar-grid" aria-live="polite"></div>
  </section>

  <!-- 選択日のアジェンダ -->
  <section class="agenda-area">
    <div class="agenda-head">
      <h2 id="agendaDate">8月4日（火）</h2>
      <button id="addEventBtn" class="btn btn-primary small">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        追加
      </button>
    </div>
    <ul id="agendaList" class="agenda-list" aria-live="polite"></ul>
    <p id="agendaEmpty" class="empty-state small" hidden>この日の予定はまだありません</p>
  </section>
</div>

<!-- 予定/タスク 追加・編集モーダル -->
<div id="eventModal" class="modal-overlay modal-overlay--top" hidden>
  <div class="modal ink-modal modal--top compact-modal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
    <div class="modal-header">
      <span class="modal-emblem" aria-hidden="true">🗓️</span>
      <h2 id="eventModalTitle">予定を追加</h2>
    </div>

    <div class="modal-body">
      <label class="field kind-field">
        <span class="field-label">種別</span>
        <div class="segmented" id="typeSegment">
          <button type="button" class="seg-btn active" data-type="event">予定</button>
          <button type="button" class="seg-btn" data-type="task">タスク</button>
        </div>
      </label>

      <label class="field">
        <span class="field-label">タイトル</span>
        <input id="eventTitle" type="text" placeholder="例）歯医者の予約" autocomplete="off" />
      </label>

      <label class="field">
        <span class="field-label">日付</span>
        <input id="eventDate" type="date" />
      </label>

      <label class="field toggle-field" id="allDayField">
        <span class="field-label">終日</span>
        <input id="eventAllDay" type="checkbox" />
      </label>

      <div class="two-col" id="timeFields">
        <label class="field">
          <span class="field-label">開始</span>
          <input id="eventStart" type="time" />
        </label>
        <label class="field">
          <span class="field-label">終了（任意）</span>
          <input id="eventEnd" type="time" />
        </label>
      </div>

      <label class="field">
        <span class="field-label">色分け</span>
        <div class="color-picker" id="colorPicker"></div>
      </label>

      <label class="field">
        <span class="field-label">メモ（任意）</span>
        <input id="eventMemo" type="text" placeholder="例）保険証を忘れずに" autocomplete="off" />
      </label>
    </div>

    <div class="modal-actions">
      <button id="eventSubmitBtn" class="btn btn-primary full">保存する</button>
      <button id="eventDeleteBtn" class="btn btn-danger full" hidden>削除する</button>
      <button class="btn btn-secondary full" data-close="eventModal">キャンセル</button>
    </div>
  </div>
</div>

<!-- インストール促し バナー -->
<div id="installBanner" class="install-banner" hidden>
  <span class="install-emblem" aria-hidden="true">🗓️</span>
  <div class="install-text">
    <strong>ホーム画面に追加できます</strong>
    <span>アプリのようにワンタッチで開けます</span>
  </div>
  <button id="installBtn" class="btn btn-primary small">インストール</button>
  <button id="installDismiss" class="icon-btn small" aria-label="閉じる">✕</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
