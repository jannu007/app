<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>そろばん帳 - 個人事業主のかんたん帳簿</title>
<meta name="description" content="和風・水彩画風デザインの、フリーランス・個人事業主向けかんたん帳簿アプリ。勘定科目ごとに収支を記録し、月次の損益をひと目で確認できます。完全無料・データは端末内のみ。" />
<meta name="theme-color" content="#f3ede0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#211f2b" media="(prefers-color-scheme: dark)" />

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="そろばん帳" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 動く水彩背景 -->
<div class="washi-bg" aria-hidden="true">
  <div class="ink-blob blob-a"></div>
  <div class="ink-blob blob-b"></div>
  <div class="ink-blob blob-c"></div>
  <div class="paper-texture"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div class="app-shell">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="brand">
      <span class="brand-emblem" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="32" height="32">
          <rect x="10" y="14" width="44" height="36" rx="4" fill="none" stroke="rgb(58,82,130)" stroke-width="2.4"/>
          <line x1="10" y1="24" x2="54" y2="24" stroke="rgb(58,82,130)" stroke-width="1.6" opacity="0.85"/>
          <line x1="20" y1="14" x2="20" y2="50" stroke="rgb(58,82,130)" stroke-width="1.6" opacity="0.5"/>
          <line x1="32" y1="14" x2="32" y2="50" stroke="rgb(58,82,130)" stroke-width="1.6" opacity="0.5"/>
          <line x1="44" y1="14" x2="44" y2="50" stroke="rgb(58,82,130)" stroke-width="1.6" opacity="0.5"/>
          <circle cx="20" cy="18.5" r="3.4" fill="rgb(196,149,63)"/>
          <circle cx="32" cy="30" r="3.4" fill="rgb(196,149,63)"/>
          <circle cx="44" cy="18.5" r="3.4" fill="rgb(196,149,63)"/>
          <circle cx="20" cy="41.5" r="3.4" fill="rgb(176,58,46)"/>
          <circle cx="32" cy="41.5" r="3.4" fill="rgb(176,58,46)"/>
          <circle cx="44" cy="30" r="3.4" fill="rgb(196,149,63)"/>
        </svg>
      </span>
      <h1>そろばん帳</h1>
    </div>
    <button id="menuBtn" class="icon-btn" aria-label="メニュー" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 7h16v2H4zM4 15h16v2H4z"/></svg>
    </button>

    <nav id="menuPanel" class="menu-panel" hidden>
      <button data-action="export-json" class="menu-item">📤 データ書き出し（JSON）</button>
      <button data-action="import-json" class="menu-item">📥 データ読み込み（JSON）</button>
      <button data-action="export-csv" class="menu-item">🧾 CSVで書き出し</button>
      <button data-action="reset" class="menu-item danger">🗑 全データを削除</button>
      <button data-action="install" id="installMenuItem" class="menu-item" hidden>📲 アプリをインストール</button>
    </nav>
    <input type="file" id="importFile" accept="application/json" hidden />
  </header>

  <div class="wave-divider" aria-hidden="true"></div>

  <div id="menuScrim" class="menu-scrim" hidden></div>

  <!-- 月ナビ -->
  <section class="date-nav card">
    <button id="prevMonth" class="day-btn" aria-label="前月">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15 18l-6-6 6-6v12z"/></svg>
      前月
    </button>
    <button id="monthDisplay" class="date-display">
      <span id="monthText">2026年 8月</span>
      <span id="monthSub" class="date-sub"></span>
    </button>
    <button id="nextMonth" class="day-btn" aria-label="翌月">
      翌月
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 6l6 6-6 6V6z"/></svg>
    </button>
  </section>
  <input type="month" id="monthPicker" class="sr-picker" aria-label="月を選択" />

  <!-- 損益サマリー -->
  <section class="summary-row card">
    <div class="summary-item income">
      <span class="summary-label">収入</span>
      <span class="summary-value"><span id="incomeValue">0</span><span class="yen">円</span></span>
    </div>
    <div class="summary-item expense">
      <span class="summary-label">支出</span>
      <span class="summary-value"><span id="expenseValue">0</span><span class="yen">円</span></span>
    </div>
    <div class="summary-item profit">
      <span class="summary-label">損益</span>
      <span class="summary-value"><span id="profitValue">0</span><span class="yen">円</span></span>
    </div>
  </section>

  <!-- 仕訳リスト -->
  <main class="entry-area">
    <ul id="entryList" class="entry-list" aria-live="polite"></ul>
    <p id="emptyState" class="empty-state" hidden>
      <span class="empty-emblem">🧮</span>
      この月の記録はまだありません<br />
      「記帳」から書き込んでみましょう
    </p>
  </main>

  <!-- 操作バー -->
  <footer class="bottom-bar card">
    <div class="bottom-buttons">
      <button id="addOpenBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        記帳
      </button>
      <button id="reportOpenBtn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 21V9h3v12H5zm6 0V3h3v18h-3zm6 0v-7h3v7h-3z"/></svg>
        損益レポート
      </button>
    </div>
  </footer>
</div>

<!-- 記帳 モーダル -->
<div id="addModal" class="modal-overlay modal-overlay--top" hidden>
  <div class="modal ink-modal modal--top compact-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <span class="modal-emblem" aria-hidden="true">🧮</span>
      <h2 id="modalTitle">記帳</h2>
    </div>

    <div class="modal-body">
      <label class="field">
        <span class="field-label">日付</span>
        <input id="itemDate" type="date" />
      </label>

      <label class="field kind-field">
        <span class="field-label">種別</span>
        <div class="segmented" id="kindSegment">
          <button type="button" class="seg-btn active" data-kind="expense">支出</button>
          <button type="button" class="seg-btn" data-kind="income">収入</button>
        </div>
      </label>

      <label class="field">
        <span class="field-label">勘定科目</span>
        <select id="itemAccount"></select>
      </label>

      <label class="field">
        <span class="field-label">摘要</span>
        <input id="itemMemo" type="text" placeholder="例）文房具の購入" autocomplete="off" />
      </label>

      <label class="field">
        <span class="field-label">金額</span>
        <input id="itemAmount" type="number" inputmode="numeric" placeholder="例）1200" min="0" />
      </label>
    </div>

    <div class="modal-actions">
      <button id="submitBtn" class="btn btn-primary full">記帳する</button>
      <button id="cancelBtn" class="btn btn-secondary full">キャンセル</button>
    </div>
  </div>
</div>

<!-- 損益レポート モーダル -->
<div id="reportModal" class="modal-overlay" hidden>
  <div class="modal ink-modal graph-modal" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <div class="modal-header">
      <span class="modal-emblem" aria-hidden="true">📊</span>
      <h2 id="reportTitle">損益レポート</h2>
    </div>

    <div class="graph-tabs">
      <button class="tab-btn active" data-range="month">今月の内訳</button>
      <button class="tab-btn" data-range="6month">半年の推移</button>
    </div>

    <div class="modal-body graph-body">
      <div id="pieWrap" class="pie-wrap">
        <canvas id="pieChart" width="260" height="260"></canvas>
        <ul id="pieLegend" class="pie-legend"></ul>
        <p id="pieEmpty" class="empty-state small" hidden>データがありません</p>
      </div>
      <div id="barWrap" class="bar-wrap" hidden>
        <canvas id="barChart" width="320" height="220"></canvas>
      </div>
    </div>

    <div class="modal-actions">
      <button id="reportCloseBtn" class="btn btn-secondary full">とじる</button>
    </div>
  </div>
</div>

<!-- インストール促し バナー -->
<div id="installBanner" class="install-banner" hidden>
  <span class="install-emblem" aria-hidden="true">🧮</span>
  <div class="install-text">
    <strong>ホーム画面に追加できます</strong>
    <span>アプリのようにワンタッチで開けます</span>
  </div>
  <button id="installBtn" class="btn btn-primary small">インストール</button>
  <button id="installDismiss" class="icon-btn small" aria-label="閉じる">✕</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
